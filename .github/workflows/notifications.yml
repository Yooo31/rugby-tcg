# Notifications : lancement à la main seulement, en secours. La tâche est
# déclenchée toutes les 15 minutes par Supabase (pg_cron, voir
# supabase/cron/notifications.sql) : GitHub ne tenait pas ce rythme (un
# passage toutes les 5 heures environ), et deux déclencheurs en même temps
# pourraient envoyer deux fois la même notification.
#
# Secret du dépôt requis : CRON_SECRET, identique à celui de Vercel (production).
# Bon à savoir : GitHub peut retarder une tâche planifiée de quelques minutes, et
# la désactive après 60 jours sans activité sur le dépôt.
name: Notifications

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  send:
    name: Envoi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appel de la tâche planifiée
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://rugby-tcg.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET absent des secrets du dépôt."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 60 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/notifications"
          echo
