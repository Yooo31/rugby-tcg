# Non-régression : à chaque push et pull request vers main et develop.
# Les noms des jobs servent de vérifications obligatoires (protection des branches).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Valeurs factices : la CI ne parle à aucun service réel. La base des tests
# d'intégration est un Postgres jetable lancé par `pnpm test:db`.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Qualité
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Le jeton ne doit pas rester dans .git/config, lisible par les scripts.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formatage
        run: pnpm format:check
      - name: Tests et couverture
        run: pnpm test:cov
      # Après les tests : fallow lit leur couverture pour des scores de risque exacts.
      - name: Maintenabilité (fallow)
        run: |
          pnpm fallow --format github-summary >> "$GITHUB_STEP_SUMMARY" || true
          pnpm fallow

  database:
    name: Base de données
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Le jeton ne doit pas rester dans .git/config, lisible par les scripts.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations et tests d'intégration (Postgres jetable)
        run: pnpm test:db

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Le jeton ne doit pas rester dans .git/config, lisible par les scripts.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: Bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # Le jeton ne doit pas rester dans .git/config, lisible par les scripts.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supabase local (Postgres, authentification, API)
        run: pnpm e2e:supabase
      - name: Schéma et catalogue
        run: pnpm e2e:prepare
      # Le navigateur est gardé en cache d'une exécution à l'autre (clé : version
      # de Playwright). Les paquets système, déjà présents sur ubuntu-latest, ne
      # sont pas réinstallés : `--with-deps` prenait parfois plus de 10 minutes.
      - name: Version de Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache du navigateur
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Navigateur
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Parcours (mobile et bureau)
        run: pnpm e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-bout-en-bout
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  commits:
    name: Commits
    # Les messages de Dependabot ont des lignes trop longues pour commitlint ;
    # leur titre est contrôlé par la configuration de Dependabot.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Messages conventionnels
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
